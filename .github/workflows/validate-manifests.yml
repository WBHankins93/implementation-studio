name: Validate Kubernetes Manifests

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/kustomization.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/kustomization.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.7"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin

      - name: Validate YAML files
        run: |
          set -euo pipefail

          find . \
            \( -path "./node_modules" -o -path "./.vitepress/dist" -o -path "./.terraform" \) -prune -o \
            \( -name "*.yaml" -o -name "*.yml" \) -print0 |
          while IFS= read -r -d '' file; do
            # Skip non-Kubernetes YAML files
            if grep -Eq "^[[:space:]]*(apiVersion|kind):" "$file" 2>/dev/null; then
              echo "Validating $file"
              kubeconform \
                -strict \
                -ignore-missing-schemas \
                -kubernetes-version 1.29.0 \
                "$file"
            fi
          done

      - name: Setup kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin

      - name: Validate kustomize
        run: |
          find . -name "kustomization.yaml" | while read file; do
            echo "Validating kustomize: $file"
            cd "$(dirname "$file")"
            kustomize build . > /dev/null || exit 1
            cd - > /dev/null
          done
