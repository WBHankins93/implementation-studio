apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: argo
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to proxy (if proxy is in cluster)
  # Adjust based on your proxy deployment
  - to:
    - namespaceSelector:
        matchLabels:
          name: proxy
    ports:
    - protocol: TCP
      port: 3128
  # Allow internal cluster communication
  - to:
    - namespaceSelector: {}
    - podSelector: {}
  # Allow egress to GCP services (Private Google Access)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-proxy-egress
  namespace: argo
spec:
  podSelector:
    matchLabels:
      app: argo-workflows
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to proxy
  - to:
    - namespaceSelector:
        matchLabels:
          name: proxy
    ports:
    - protocol: TCP
      port: 3128
  # Allow internal cluster communication
  - to:
    - namespaceSelector: {}
    - podSelector: {}

