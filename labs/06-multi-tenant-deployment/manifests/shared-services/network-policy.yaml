apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-services-access
  namespace: shared-services
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # Allow ingress from all tenant namespaces
  - from:
    - namespaceSelector:
        matchExpressions:
          - key: tenant
            operator: Exists
  # Allow ingress from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: shared-services
  # Allow DNS
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

