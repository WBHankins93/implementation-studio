apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-alerts
  namespace: monitoring
  labels:
    app: application-alerts
spec:
  groups:
  - name: application.rules
    interval: 30s
    rules:
    # High CPU Usage
    - alert: HighCPUUsage
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace!="monitoring"}[5m])) by (namespace, pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value }} CPU (threshold: 0.8)"

    # High Memory Usage
    - alert: HighMemoryUsage
      expr: |
        sum(container_memory_working_set_bytes{namespace!="monitoring"}) by (namespace, pod) / sum(container_spec_memory_limit_bytes{namespace!="monitoring"}) by (namespace, pod) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} memory (threshold: 80%)"

    # Pod Crash Loops
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"

    # Pod Not Ready
    - alert: PodNotReady
      expr: |
        sum by (namespace, pod) (kube_pod_status_phase{phase!="Running", phase!="Succeeded"}) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready"

    # Disk Space Low
    - alert: DiskSpaceLow
      expr: |
        (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Disk space is low"
        description: "Node {{ $labels.instance }} has less than 10% disk space available"

    # High Error Rate
    - alert: HighErrorRate
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[5m])) by (namespace, service) / sum(rate(http_requests_total[5m])) by (namespace, service) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
        description: "Service {{ $labels.service }} in namespace {{ $labels.namespace }} has {{ $value | humanizePercentage }} error rate (threshold: 5%)"

    # Argo Workflows Failed
    - alert: ArgoWorkflowFailed
      expr: |
        sum(rate(argo_workflows_count{phase="Failed"}[5m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Argo Workflow failed"
        description: "Argo Workflow {{ $labels.name }} has failed"

    # Argo Workflows Running Too Long
    - alert: ArgoWorkflowRunningTooLong
      expr: |
        time() - argo_workflows_workflow_creation_timestamp > 3600
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "Argo Workflow running for more than 1 hour"
        description: "Argo Workflow {{ $labels.name }} has been running for more than 1 hour"

