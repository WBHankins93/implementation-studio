apiVersion: v1
kind: Namespace
metadata:
  name: oauth-proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: oauth-proxy
data:
  config.yaml: |
    # OAuth2 Proxy Configuration
    # Replace with your OAuth provider settings
    
    provider: "google"  # Options: google, github, gitlab, etc.
    client_id: "YOUR_CLIENT_ID"
    client_secret: "YOUR_CLIENT_SECRET"
    redirect_url: "https://your-domain.com/oauth2/callback"
    
    # Cookie settings
    cookie_secret: "GENERATE_WITH: openssl rand -base64 32"
    cookie_domains: ".your-domain.com"
    cookie_secure: "true"
    cookie_httponly: "true"
    cookie_samesite: "lax"
    
    # Upstream
    upstreams:
      - "http://argo-workflows-server.argo.svc.cluster.local:2746"
    
    # Email domain whitelist (optional)
    # email_domains:
    #   - "yourcompany.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: oauth-proxy
type: Opaque
stringData:
  client-id: "YOUR_CLIENT_ID"
  client-secret: "YOUR_CLIENT_SECRET"
  cookie-secret: "GENERATE_WITH_OPENSSL"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: oauth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        ports:
        - containerPort: 4180
          name: http
        - containerPort: 8080
          name: metrics
        args:
        - --config=/etc/oauth2-proxy/config.yaml
        - --http-address=0.0.0.0:4180
        - --metrics-address=0.0.0.0:8080
        volumeMounts:
        - name: config
          mountPath: /etc/oauth2-proxy
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: cookie-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: config
        configMap:
          name: oauth2-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: oauth-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
  - port: 4180
    targetPort: 4180
    name: http
  - port: 8080
    targetPort: 8080
    name: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: oauth-proxy
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: oauth2-proxy-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180

