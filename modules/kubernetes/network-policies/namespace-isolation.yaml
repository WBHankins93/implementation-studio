apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: namespace-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: "{{NAMESPACE}}"
  # Allow ingress from shared services
  - from:
    - namespaceSelector:
        matchLabels:
          name: shared-services
  # Allow DNS
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  egress:
  # Allow egress to same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: "{{NAMESPACE}}"
  # Allow egress to shared services
  - to:
    - namespaceSelector:
        matchLabels:
          name: shared-services
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to internet (if needed)
  - to:
    - namespaceSelector: {}

