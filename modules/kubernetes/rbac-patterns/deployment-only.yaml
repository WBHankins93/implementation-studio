apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-only
  namespace: "{{NAMESPACE}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-only
  namespace: "{{NAMESPACE}}"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-only
  namespace: "{{NAMESPACE}}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-only
subjects:
- kind: ServiceAccount
  name: deployment-only
  namespace: "{{NAMESPACE}}"
- kind: User
  name: "{{USER}}"
  apiGroup: rbac.authorization.k8s.io

