apiVersion: v1
kind: ResourceQuota
metadata:
  name: limited-quota
  namespace: "{{NAMESPACE}}"
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    persistentvolumeclaims: "3"
    services.loadbalancers: "1"
    services.nodeports: "2"
    count/deployments.apps: "5"
    count/statefulsets.apps: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limited-limits
  namespace: "{{NAMESPACE}}"
spec:
  limits:
  - default:
      cpu: "200m"
      memory: 256Mi
    defaultRequest:
      cpu: "50m"
      memory: 64Mi
    type: Container
  - max:
      cpu: "1"
      memory: 2Gi
    min:
      cpu: "50m"
      memory: 64Mi
    type: Container

